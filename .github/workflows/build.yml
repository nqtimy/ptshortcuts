name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pynput pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --onefile --windowed --name PTShortcuts `
            --manifest ptshortcuts.manifest `
            --add-data "shortcuts;shortcuts" `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTShortcuts-windows
          path: dist/PTShortcuts.exe

  build-mac:
    name: Build macOS (binary)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pynput pyinstaller
          python -m pip install pyobjc-framework-Quartz || echo "Quartz optional, skipping"

      - name: Build
        run: |
          python -m PyInstaller \
            --onefile \
            --windowed \
            --name PTShortcuts \
            --add-data "shortcuts:shortcuts" \
            --hidden-import "pynput.keyboard._darwin" \
            --hidden-import "pynput.mouse._darwin" \
            --collect-all "pynput" \
            main.py

      - name: Zip binary
        run: |
          cd dist
          zip -r PTShortcuts-mac.zip PTShortcuts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTShortcuts-mac
          path: dist/PTShortcuts-mac.zip

  release:
    name: Create GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PTShortcuts-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PTShortcuts-mac
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PTShortcuts.exe
            artifacts/PTShortcuts-mac.zip
          generate_release_notes: true
          draft: false
          prerelease: false
