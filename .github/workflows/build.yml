name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pynput pyinstaller

      - name: Write Supabase config
        if: ${{ env.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          '{"url": "${{ env.SUPABASE_URL }}", "anon_key": "${{ env.SUPABASE_ANON_KEY }}"}' | Out-File -Encoding utf8 supabase_config.json

      - name: Build
        run: |
          $extra = if (Test-Path supabase_config.json) { '--add-data "supabase_config.json;."' } else { '' }
          $cmd = "python -m PyInstaller --onefile --windowed --name PTShortcuts ``
            --manifest ptshortcuts.manifest ``
            --add-data `"shortcuts;shortcuts`" ``
            --add-data `"assets;assets`" ``
            --hidden-import pynput.keyboard._win32 ``
            --hidden-import pynput.mouse._win32 ``
            $extra ``
            main.py"
          Invoke-Expression $cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTShortcuts-windows
          path: dist/PTShortcuts.exe

  build-mac:
    name: Build macOS (binary)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pynput pyinstaller
          python -m pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz

      - name: Write Supabase config
        if: ${{ env.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo '{"url": "${{ env.SUPABASE_URL }}", "anon_key": "${{ env.SUPABASE_ANON_KEY }}"}' > supabase_config.json

      - name: Build
        run: |
          EXTRA=""
          [ -f supabase_config.json ] && EXTRA='--add-data "supabase_config.json:."'
          eval python -m PyInstaller \
            --windowed \
            --name PTShortcuts \
            --add-data "shortcuts:shortcuts" \
            --add-data "assets:assets" \
            $EXTRA \
            --hidden-import "pynput.keyboard._darwin" \
            --hidden-import "pynput.mouse._darwin" \
            --hidden-import "Quartz" \
            --hidden-import "AppKit" \
            --collect-all "pynput" \
            --collect-all "Quartz" \
            --collect-all "AppKit" \
            --collect-all "objc" \
            main.py

      - name: Codesign (ad-hoc) and zip .app
        run: |
          codesign --force --deep --sign - dist/PTShortcuts.app || true
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PTShortcuts.app PTShortcuts-mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PTShortcuts-mac
          path: dist/PTShortcuts-mac.zip

  release:
    name: Create GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PTShortcuts-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PTShortcuts-mac
          path: artifacts/

      - name: Checkout repo for release notes
        uses: actions/checkout@v4
        with:
          path: src

      - name: Resolve release notes file
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          NOTES="src/docs/RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "Using custom release notes: $NOTES"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No custom notes file found at $NOTES — falling back to auto-generated"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PTShortcuts.exe
            artifacts/PTShortcuts-mac.zip
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          draft: false
          prerelease: false
